services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Luxembourg
      DATABASE_URL: jdbc:postgresql://db:5432/warp3
      DATABASE_USER: warp3
      DATABASE_PASSWORD: warp3
      SPACE_API_KEY: PLEASE_CHANGE_THIS
      WEBHOOK_SPACE_SECRET: PLEASE_CHANGE_THIS
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: warp3
      POSTGRES_USER: warp3
      POSTGRES_PASSWORD: warp3
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warp3"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

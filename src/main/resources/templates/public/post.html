<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <link rel="stylesheet" th:href="@{/css/pages/post.css}">
</head>

<main class="post-container" layout:fragment="content">

    <article>
        <header class="post-header">
            <h1 th:text="${post.title}">Post Title</h1>
            <div class="post-meta">
                <span th:if="${post.author}" th:text="'by ' + ${post.author.username}">by Author</span>
                <span th:if="${post.publishedAt}" th:text="${#temporals.format(post.publishedAt, 'dd MMM yyyy')}">20 Jan 2025</span>
                <span th:unless="${post.publishedAt}" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">20 Jan 2025</span>
            </div>
        </header>

        <!-- Use contentHtml (pre-rendered markdown) -->
        <div class="post-body" th:utext="${post.contentHtml}">
            <p>Content here</p>
        </div>
    </article>

    <div class="post-footer">
        <a href="/blog" class="post-back">← Back to Blog</a>
    </div>

</main>

</html>

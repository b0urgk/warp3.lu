<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layouts/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <link rel="stylesheet" th:href="@{/css/pages/events.css}">
</head>

<main layout:fragment="content">

    <div class="calendar-header">
        <a th:href="@{/events(year=${prevYear}, month=${prevMonth})}" class="calendar-nav">&larr;</a>
        <h2 th:text="${monthLabel}">March 2026</h2>
        <a th:href="@{/events(year=${nextYear}, month=${nextMonth})}" class="calendar-nav">&rarr;</a>
    </div>

    <div class="calendar-grid">
        <div class="calendar-dow">Mon</div>
        <div class="calendar-dow">Tue</div>
        <div class="calendar-dow">Wed</div>
        <div class="calendar-dow">Thu</div>
        <div class="calendar-dow">Fri</div>
        <div class="calendar-dow">Sat</div>
        <div class="calendar-dow">Sun</div>

        <th:block th:each="week : ${weeks}">
            <div th:each="day : ${week}"
                 class="calendar-day"
                 th:classappend="${day.isToday ? 'is-today' : ''} + ' ' + ${day.isCurrentMonth ? '' : 'other-month'}">
                <span class="day-number" th:text="${day.dayOfMonth}">1</span>
                <div class="day-events" th:if="${day.isCurrentMonth && !#lists.isEmpty(day.events)}">
                    <span th:each="event : ${day.events}"
                          class="day-event-title"
                          th:classappend="${event.external ? ' external' : ''}"
                          th:text="${event.title}">Event</span>
                </div>
            </div>
        </th:block>
    </div>

    <div class="calendar-actions">
        <a th:href="${webcalUrl}" class="cal-subscribe-btn">Subscribe to calendar</a>
    </div>

    <div th:if="${#lists.isEmpty(monthEvents)}" class="events-empty">
        <p>No events this month.</p>
    </div>

    <div th:unless="${#lists.isEmpty(monthEvents)}" class="events-list">
        <h3 class="events-list-heading">Events this month</h3>
        <article th:each="event : ${monthEvents}"
                 class="event-item"
                 th:classappend="${event.external ? ' external' : ''}"
                 th:attr="data-title=${event.title},
                          data-start=${#temporals.format(event.startTime, 'yyyyMMdd''T''HHmmss')},
                          data-end=${#temporals.format(event.endTime, 'yyyyMMdd''T''HHmmss')},
                          data-location=${event.location},
                          data-description=${event.description}">
            <time class="event-date">
                <span class="event-day" th:text="${#temporals.format(event.startTime, 'dd')}">08</span>
                <span class="event-month" th:text="${#temporals.format(event.startTime, 'MMM')}">Mar</span>
            </time>
            <div class="event-content">
                <h3 class="event-title" th:text="${event.title}">Event Title</h3>
                <span th:if="${event.external && event.eventType != null}" class="event-type-badge" th:text="${event.eventType}">Workshop</span>
                <div class="event-meta">
                    <span class="event-time">
                        <span th:if="${event.allDay}">All day</span>
                        <span th:unless="${event.allDay}" th:text="${#temporals.format(event.startTime, 'HH:mm')} + ' – ' + ${#temporals.format(event.endTime, 'HH:mm')}">20:00 – 23:00</span>
                    </span>
                    <span th:if="${event.location}" class="event-location" th:text="${event.location}">Differdange</span>
                    <span th:if="${event.external}" class="event-source-badge">wiki</span>
                </div>
                <p th:if="${event.subtitle}" class="event-subtitle" th:text="${event.subtitle}">Subtitle</p>
                <p th:if="${event.description}" class="event-description" th:text="${event.description}">Description...</p>
                <div class="event-actions">
                    <a th:if="${!event.external && event.linkedPostSlug != null}" th:href="@{/blog/{slug}(slug=${event.linkedPostSlug})}" class="event-link">Read more &rarr;</a>
                    <a th:if="${event.external && event.wikiUrl != null}" th:href="${event.wikiUrl}" target="_blank" class="event-link">View on wiki &rarr;</a>
                    <div class="cal-dropdown">
                        <button type="button" class="add-to-cal-btn" onclick="toggleCalMenu(this)">+ Add to calendar</button>
                        <div class="cal-menu">
                            <a href="#" onclick="addToGoogle(this); return false;">Google Calendar</a>
                            <a href="#" onclick="downloadIcs(this); return false;">Other (Outlook, Apple, ...)</a>
                        </div>
                    </div>
                </div>
            </div>
        </article>
    </div>

    <script>
        function toggleCalMenu(btn) {
            var menu = btn.nextElementSibling;
            // close all other open menus
            document.querySelectorAll('.cal-menu.open').forEach(function(m) {
                if (m !== menu) m.classList.remove('open');
            });
            menu.classList.toggle('open');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.cal-dropdown')) {
                document.querySelectorAll('.cal-menu.open').forEach(function(m) {
                    m.classList.remove('open');
                });
            }
        });

        function getEventData(el) {
            var item = el.closest('.event-item');
            return {
                title: item.dataset.title || '',
                start: item.dataset.start || '',
                end: item.dataset.end || '',
                location: item.dataset.location || '',
                description: item.dataset.description || ''
            };
        }

        function addToGoogle(el) {
            var d = getEventData(el);
            var url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
                + '&text=' + encodeURIComponent(d.title)
                + '&dates=' + d.start + '/' + d.end
                + '&location=' + encodeURIComponent(d.location)
                + '&details=' + encodeURIComponent(d.description);
            window.open(url, '_blank');
        }

        function downloadIcs(el) {
            var d = getEventData(el);
            var uid = d.start + '-' + d.title.replace(/\s+/g, '-').toLowerCase() + '@warp3.lu';
            var ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//warp3.lu//Events//EN',
                'BEGIN:VEVENT',
                'UID:' + uid,
                'DTSTART:' + d.start,
                'DTEND:' + d.end,
                'SUMMARY:' + escIcal(d.title),
                d.location ? 'LOCATION:' + escIcal(d.location) : '',
                d.description ? 'DESCRIPTION:' + escIcal(d.description) : '',
                'END:VEVENT',
                'END:VCALENDAR'
            ].filter(Boolean).join('\r\n') + '\r\n';

            var blob = new Blob([ics], {type: 'text/calendar;charset=utf-8'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = d.title.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.ics';
            a.click();
            URL.revokeObjectURL(url);
        }

        function escIcal(s) {
            return s.replace(/\\/g, '\\\\').replace(/,/g, '\\,').replace(/;/g, '\\;').replace(/\n/g, '\\n');
        }
    </script>

</main>

</html>
